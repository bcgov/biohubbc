version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "18:00"
      timezone: "America/Vancouver"
    commit-message:
      prefix: "SIMSBIOHUB-000"
    labels:
      - "Ready For Review"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api"
      - "/app"
      - "/database"
      - "/testing/e2e"
    schedule:
      interval: "weekly"
      time: "18:00"
      timezone: "America/Vancouver"
    commit-message:
      prefix: "SIMSBIOHUB-000"
    labels:
      - "Ready For Review"
    open-pull-requests-limit: 4
    # Each group raises one pull request spanning every directory above that has updates, so a
    # run opens at most one PR per group. Minor and patch updates are kept apart from majors so
    # the routine bumps can merge while the breaking ones wait for review.
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"
