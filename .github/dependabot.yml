version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "18:00"
      timezone: "America/Vancouver"
    commit-message:
      prefix: "SIMSBIOHUB-000"
    labels:
      - "Ready For Review"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*" 
