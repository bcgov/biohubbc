name: 'OpenShift Login with Retry'
description: 'Login to OpenShift with retry logic and exponential backoff'
inputs:
  openshift_server_url:
    description: 'OpenShift server URL'
    required: true
  openshift_token:
    description: 'OpenShift token for authentication'
    required: true
  namespace:
    description: 'OpenShift namespace'
    required: false
    default: ''
  max_retries:
    description: 'Maximum number of retry attempts'
    required: false
    default: '3'
  base_delay:
    description: 'Base delay in seconds for exponential backoff'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Log in to OpenShift with retry
      shell: bash
      run: |
        set -e
        MAX_RETRIES=${{ inputs.max_retries }}
        RETRY_COUNT=0
        BASE_DELAY=${{ inputs.base_delay }}
        
        # Build the oc login command
        LOGIN_CMD="oc login ${{ inputs.openshift_server_url }} --token=${{ inputs.openshift_token }}"
        if [ -n "${{ inputs.namespace }}" ]; then
          LOGIN_CMD="$LOGIN_CMD --namespace=${{ inputs.namespace }}"
        fi
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Logging in to OpenShift..."
          
          if $LOGIN_CMD; then
            echo "Successfully logged in to OpenShift on attempt $((RETRY_COUNT + 1))"
            break
          else
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              DELAY=$((BASE_DELAY * (2 ** RETRY_COUNT)))
              echo "Login failed. Retrying in $DELAY seconds... (Attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep $DELAY
            else
              echo "Failed to log in to OpenShift after $MAX_RETRIES attempts"
              exit 1
            fi
          fi
        done
