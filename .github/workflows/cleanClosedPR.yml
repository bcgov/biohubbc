# Clean out all deployment artifacts when a PR is closed, but not merged.
# Will attempt to remove all artifacts from any PR that was opened against any branch (and then closed (not merged)).
name: Clean Closed PR Artifacts

on:
  pull_request:
    types: [closed]

env:
  IMAGE_TAG: build-1.0.0-${{ github.event.number }}
  
jobs:
  clean:
    name: Clean Deployment Artifacts for API and App in Dev and Tools environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Don't run if the PR was merged
    if: ${{ github.event.pull_request.merged != true }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift with retry logic
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: ./.github/actions/openshift-login-retry
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}

      # Clean all deployment artifacts for the PR using Helm
      - name: Clean Deployment Artifacts
        run: |
          echo "Cleaning deployment artifacts for PR $PR_NUMBER using Helm"
          
          # Clean from dev namespace (where Helm releases are deployed)
          echo "Cleaning from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev namespace..."
          helm uninstall "pr-$PR_NUMBER" --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev || echo "No Helm release found in dev namespace for PR $PR_NUMBER"
          
          # Remove App image tag from registry
          echo "Removing App image tag from registry..."
          oc tag -d biohubbc-app:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          # Remove API image tag from registry
          echo "Removing API image tag from registry..."
          oc tag -d biohubbc-api:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          # Remove DB image tag from registry
          echo "Removing DB image tag from registry..."
          oc tag -d biohubbc-db:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          # Remove DB Setup image tag from registry
          echo "Removing DB Setup image tag from registry..."
          oc tag -d biohubbc-db-setup:${{ env.IMAGE_TAG }}  --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"
                    
          echo "Cleanup completed for PR $PR_NUMBER"
