          oc: "4.16"

      # Log in to OpenShift with retry logic.
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Logging in to OpenShift..."
            if oc login --token=${{ secrets.TOOLS_SA_TOKEN }} --server=https://api.silver.devops.gov.bc.ca:6443; then
              echo "Successfully logged in to OpenShift on attempt $ATTEMPT"
              break
            else
              echo "Failed to log in to OpenShift on attempt $ATTEMPT"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                WAIT_TIME=$((ATTEMPT * 10))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
              else
                echo "All $MAX_ATTEMPTS attempts failed. Exiting."
                exit 1
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

      # Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      # Deploy the API image using Helm
      - name: Deploy API Image
        working-directory: infrastructure/charts/api
        run: |
          echo "Deploying API for branch $BRANCH"
          
          TS=$(date +%s)
          helm upgrade --install $PR_NUMBER . \
            -f values.yaml \
            -f values-$BRANCH.yaml \
            --set-string environment.ts=${TS} \
            --wait --timeout=300s
          
          echo "API deployment completed for branch $BRANCH"

  # Clean deployment artifacts
  clean:
    name: Clean Deployment Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true }}
    needs:
      - deployDatabase
      - deployDatabaseSetup
      - deployAPI
      - deployApp
    env:
      PR_NUMBER: ${{ github.event.number }}
      BRANCH: ${{ github.base_ref }}
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift with retry logic.
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Logging in to OpenShift..."
            if oc login --token=${{ secrets.TOOLS_SA_TOKEN }} --server=https://api.silver.devops.gov.bc.ca:6443; then
              echo "Successfully logged in to OpenShift on attempt $ATTEMPT"
              break
            else
              echo "Failed to log in to OpenShift on attempt $ATTEMPT"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                WAIT_TIME=$((ATTEMPT * 10))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
              else
                echo "All $MAX_ATTEMPTS attempts failed. Exiting."
                exit 1
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

      # Clean deployment artifacts
      - name: Clean deployment artifacts
        env:
          POD_SELECTOR: biohubbc
        run: |
          echo "Cleaning deployment artifacts for PR $PR_NUMBER"
          
          # Clean from dev namespace
          # echo "Cleaning from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev namespace..."
          # oc --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev get all,pvc,secret,pods,ReplicationController,Deployment,HorizontalPodAutoscaler,imagestreamtag -o name | grep $POD_SELECTOR | grep $PR_NUMBER | awk '{print "oc delete --ignore-not-found " $1}' | bash || echo "No resources found in dev namespace"
          
          # Clean from tools namespace
          # echo "Cleaning from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools namespace..."
          # oc --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools get all,pvc,secret,pods,ReplicationController,Deployment,HorizontalPodAutoscaler,imagestreamtag -o name | grep $POD_SELECTOR | grep $PR_NUMBER | awk '{print "oc delete --ignore-not-found " $1}' | bash || echo "No resources found in tools namespace"
          
          echo "Cleanup completed for PR $PR_NUMBER"
