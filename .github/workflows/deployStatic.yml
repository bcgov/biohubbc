            --set-string environment.ts=${TS} \
            --set app.postgresAdmin=${{ secrets.POSTGRES_ADMIN }} \
            --set app.postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
            --set app.postgresUser=${{ secrets.POSTGRES_USER }} \
            --set app.postgresUserPassword=${{ secrets.POSTGRES_USER_PASSWORD }} \
            --set app.postgresUserApi=${{ secrets.POSTGRES_USER_API }} \
            --set app.postgresUserApiPassword=${{ secrets.POSTGRES_USER_API_PASSWORD }} \
            --set app.postgresDb=${{ secrets.POSTGRES_DB }} \
            --wait --timeout=300s
          
          echo "Database deployment completed for branch $BRANCH"

