# Static Deploy On OpenShift
# Builds and Deploys merged PR's to persistent pods/services/routes/etc in the OpenShift Dev or Test or Prod environment.
name: Static Deploy on OpenShift

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - test
      - prod
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number (required for manual runs)'
        required: true
        type: string

env:
  IMAGE_TAG: build-1.0.0-${{ github.event.number || github.event.inputs.pr_number }}-${{ github.base_ref || github.ref_name }}

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Print Env variables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Print Env Vars
        run: |
          echo Git Base Ref: ${{ github.base_ref || github.ref_name }}
          echo Git Change ID: ${{ github.event.number || github.event.inputs.pr_number }}
          echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha || github.sha }}
          echo Git Event Name: ${{ github.event_name }}
          echo Git Event Action: ${{ github.event.action || 'manual' }}
          echo Git Labels: "$LABELS"
          echo PR in Draft: ${{ github.event.pull_request.draft || 'false' }}

  # Checkout the repo once and cache it for use in subsequent jobs
  checkoutRepo:
    name: Checkout and cache target branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
    needs:
      - checkEnv
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cache the repo
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          # Cache repo based on the commit sha that triggered the workflow
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

  # Build the web frontend app image
  buildAndPushApp:
    name: Build App Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      APP_NAME: "biohubbc-app"
    needs:
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-$BRANCH

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the app image
      - name: Build and Push App Image
        working-directory: app
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

  # Build the Database image
  buildAndPushDatabase:
    name: Build Database Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      APP_NAME: "biohubbc-db"
    needs:
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-$BRANCH

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the database image using Docker
      - name: Build and Push Database Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

  # Build the Database Setup image
  buildAndPushDatabaseSetup:
    name: Build Database Setup Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      APP_NAME: "biohubbc-db-setup"
    needs:
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-$BRANCH

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the database setup image using Docker
      - name: Build and Push Database Setup Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} -f .docker/db/Dockerfile.setup .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

  # Build the API image
  buildAndPushAPI:
    name: Build API Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      APP_NAME: "biohubbc-api"
    needs:
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-$BRANCH

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the API image using Docker
      - name: Build and Push API Image
        working-directory: api
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

  # Deploy Helm chart
  deployHelmChart:
    name: Deploy Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
    needs:
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-$BRANCH

      # Deploy the Helm chart
      - name: Deploy Helm Chart
        run: |
          echo "Deploying Helm chart for branch $BRANCH"
          
          # Generate a timestamp
          TS=$(date +%s)
          
          # Update Helm dependencies
          echo "Updating Helm dependencies..."
          helm dependency update ./infrastructure/biohubbc

          # Build chart
          echo "Building chart..."
          helm package ./infrastructure/biohubbc \
            --version $PR_NUMBER \
            --app-version 1.0.0

          helm upgrade --install "$BRANCH" biohubbc-$PR_NUMBER.tgz \
            -f ./infrastructure/biohubbc/values.yaml \
            -f ./infrastructure/biohubbc/values-$BRANCH.yaml \
            --set-string biohubbc-app.environment.ts=$TS \
            --set-string biohubbc-app.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-db.environment.ts=$TS \
            --set-string biohubbc-db.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-db.app.postgresAdmin=${{ secrets.DATABASE_ADMIN }} \
            --set-string biohubbc-db.app.postgresAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }} \
            --set-string biohubbc-db.app.postgresUser=${{ secrets.DATABASE_USER }} \
            --set-string biohubbc-db.app.postgresUserPassword=${{ secrets.DATABASE_USER_PASSWORD }} \
            --set-string biohubbc-db.app.postgresUserApi=${{ secrets.DATABASE_USER_API }} \
            --set-string biohubbc-db.app.postgresUserApiPassword=${{ secrets.DATABASE_USER_API_PASSWORD }} \
            --set-string biohubbc-db.app.postgresDb=${{ secrets.DATABASE_NAME }} \
            --set-string biohubbc-db-setup.environment.ts=$TS \
            --set-string biohubbc-db-setup.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-api.environment.ts=$TS \
            --set-string biohubbc-api.environment.changeId=$PR_NUMBER \
            --wait --timeout=300s
          
          echo "Helm chart deployment completed for branch $BRANCH"

  # Clean deployment artifacts
  clean:
    name: Clean Deployment Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    needs:
      - deployHelmChart
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr_number }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}

      # Clean deployment artifacts
      - name: Clean deployment artifacts
        run: |
          echo "Cleaning deployment artifacts for PR $PR_NUMBER using Helm"
          
          # Clean from dev namespace (where Helm releases are deployed)
          echo "Cleaning from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev namespace..."
          helm uninstall "pr-$PR_NUMBER" --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev || echo "No Helm release found in dev namespace for PR $PR_NUMBER"
          
          echo "Cleanup completed for PR $PR_NUMBER"
