              else
                echo "All $MAX_ATTEMPTS attempts failed. Exiting."
                exit 1
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

      # Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      # Deploy the app image using Helm
      - name: Deploy App Image
        working-directory: infrastructure/charts/app
        run: |
          echo "Deploying App for branch $BRANCH"
          
          TS=$(date +%s)
          helm upgrade --install $PR_NUMBER . \
            -f values.yaml \
            -f values-$BRANCH.yaml \
            --set-string environment.ts=${TS} \
            --wait --timeout=300s
          
          echo "App deployment completed for branch $BRANCH"

