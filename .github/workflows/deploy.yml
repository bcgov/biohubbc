# PR Based Deploy On OpenShift
# Builds and Deploys unmerged PR's to temporary pods/services/routes/etc in the OpenShift Dev environment.
name: PR-Based Deploy on OpenShift

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches-ignore:
      - test
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  IMAGE_TAG: build-1.0.0-${{ github.event.number }}

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Print Env variables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false }}
    steps:
      - name: Print Env Vars
        run: |
          echo OC CLI Version: $(oc version)
          echo Git Base Ref: ${{ github.base_ref }}
          echo Git Change ID: ${{ github.event.number }}
          echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}
          echo Git Event Name: ${{ github.event_name }}
          echo Git Event Action: ${{ github.event.action }}
          echo Git Branch Ref: ${{ github.head_ref }}
          echo PR in Draft: ${{ github.event.pull_request.draft }}

  # Scans the commit against past commits, and determines if any jobs are skippable (due to no changes in target files).
  # Note: this does not take into account the current branch and will check past workflows from any branch, so an
  # additional check against the current branch is added to the `if` in the jobs below. This ensures that we only skip
  # jobs if there are no changes AND the previous successful job was against the current branch.
  skipDuplicateActions:
    name: Check for duplicate actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - checkEnv
    outputs:
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
      # Set to `true` if the latest commit message contains `ignore-skip` anywhere in the message OR the base branch
      # is dev, test, or prod.
      # Used to disable duplicate action skipping, if needed.
      ignore_skip:
        ${{ contains(steps.head_commit_message.outputs.commit_message, 'ignore-skip') ||
        github.head_ref == 'dev' || github.head_ref == 'test' || github.head_ref == 'prod' }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths_filter: |
            app:
              paths:
                - 'app/src/**'
                - 'app/package*.json'
                - 'app/.pipeline/**'
                - 'app/Dockerfile'
                - 'app/server/**'
                - 'app/public/**'
              paths_ignore:
                - 'app/src/**/*.test.ts'
                - 'app/**.md'
            api:
              paths:
                - 'api/src/**'
                - 'api/package*.json'
                - 'api/.pipeline/**'
                - 'api/Dockerfile'
              paths_ignore:
                - 'api/src/**/*.test.ts'
                - 'api/**.md'
            database:
              paths:
                - 'database/src/**' 
                - 'database/package*.json'
                - 'database/.pipeline/**'
                - 'database/.docker/Dockerfile.setup'
              paths_ignore:
                - 'database/src/**/*.test.ts'
                - 'database/**.md'

      # Get the head commit for this pull request, parse out the commit message, and assign to the `commit_message`
      # output variable, which is then used to determine if the term `ignore-skip` is found in the commit message.
      - name: Checkout head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get head commit message
        id: head_commit_message
        run: |
          echo commit message: $(git show -s --format=%s)
          echo "commit_message=$(git show -s --format=%s)" >> $GITHUB_OUTPUT

  # Checkout the repo once and cache it for use in subsequent jobs
  checkoutRepo:
    name: Checkout and cache target branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    needs:
      - skipDuplicateActions
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cache the repo
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          # Cache repo based on the commit sha that triggered the workflow
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Install Node - for `node` and `npm` commands
      # Note: This already uses actions/cache internally, so repeat calls in subsequent jobs are not a performance hit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

  # Build the web frontend app image
  buildAndPushApp:
    name: Build App Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      ( needs.skipDuplicateActions.outputs.ignore_skip == 'true' ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).app.should_skip == false ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).app.skipped_by.branch != github.head_ref ) }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohubbc-app"
    needs:
      - checkoutRepo
      - skipDuplicateActions
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Scale down any existing OpenShift pods for this PR deployment
      # Why? The new pods will be deployed before the existing pods are terminated, and twice the resources will be needed
      # in that moment. If not enough resources are available to spin up the new pods, then they may fail to deploy.
      - name: Scale down app pods
        run: oc get Deployment --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev --selector env-id=$PR_NUMBER,app-name=$APP_NAME -o name | awk '{print "oc scale --replicas=0 " $1}' | bash

      # Build and push the app image
      - name: Build and Push App Image
        working-directory: app
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the Database image
  buildAndPushDatabase:
    name: Build Database Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      ( needs.skipDuplicateActions.outputs.ignore_skip == 'true' ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).database.should_skip == false ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).database.skipped_by.branch != github.head_ref ) }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohubbc-db"
    needs:
      - checkoutRepo
      - skipDuplicateActions
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Scale down any existing OpenShift pods for this PR deployment
      # Why? The new pods will be deployed before the existing pods are terminated, and twice the resources will be needed
      # in that moment. If not enough resources are available to spin up the new pods, then they may fail to deploy.
      - name: Scale down database pods
        run: oc get Deployment --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev --selector env-id=$PR_NUMBER,app-name=$APP_NAME -o name | awk '{print "oc scale --replicas=0 " $1}' | bash

      # Build and push the database image using Docker
      - name: Build and Push Database Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the Database Setup image
  buildAndPushDatabaseSetup:
    name: Build Database Setup Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      ( needs.skipDuplicateActions.outputs.ignore_skip == 'true' ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).database.should_skip == false ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).database.skipped_by.branch != github.head_ref ) }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohubbc-db-setup"
    needs:
      - checkoutRepo
      - skipDuplicateActions
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the database setup image using Docker
      - name: Build and Push Database Setup Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} -f .docker/db/Dockerfile.setup .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the API image
  buildAndPushAPI:
    name: Build API Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      ( needs.skipDuplicateActions.outputs.ignore_skip == 'true' ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).api.should_skip == false ||
      fromJSON(needs.skipDuplicateActions.outputs.paths_result).api.skipped_by.branch != github.head_ref ) }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohubbc-api"
    needs:
      - checkoutRepo
      - skipDuplicateActions
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Authenticate Docker with OpenShift registry
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Scale down any existing OpenShift pods for this PR deployment
      # Why? The new pods will be deployed before the existing pods are terminated, and twice the resources will be needed
      # in that moment. If not enough resources are available to spin up the new pods, then they may fail to deploy.
      - name: Scale down API pods
        run: oc get Deployment --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev --selector env-id=$PR_NUMBER,app-name=$APP_NAME -o name | awk '{print "oc scale --replicas=0 " $1}' | bash

      # Build and push the API image
      - name: Build and Push API Image
        working-directory: api
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          
      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif
          
  # Deploy Helm chart
  deployHelmChart:
    name: Deploy Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      ( needs.buildAndPushApp.result == 'success' ||
      needs.buildAndPushDatabase.result == 'success' ||
      needs.buildAndPushDatabaseSetup.result == 'success' ||
      needs.buildAndPushAPI.result == 'success' ) }}
    environment: dev
    env:
      PR_NUMBER: ${{ github.event.number }}
    needs:
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v4
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}/*
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Install oc, which was removed from the ubuntu-latest image in v24.04
      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      # Log in to OpenShift
      # Note: The secrets needed to log in are NOT available if the PR comes from a FORK.
      # PR's must originate from a branch off the original repo or else all openshift `oc` commands will fail.
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{ secrets.TOOLS_SA_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Deploy the Helm chart
      - name: Deploy Helm Chart
        run: |
          echo "Deploying Helm chart for PR $PR_NUMBER"

          # Generate a timestamp
          TS=$(date +%s)
          
          # Update Helm dependencies
          echo "Updating Helm dependencies..."
          helm dependency update ./infrastructure/biohubbc
          
          # Build chart
          echo "Building chart..."
          helm package ./infrastructure/biohubbc \
            --version $TS \
            --app-version 1.0.0

          helm upgrade --install "pr-$PR_NUMBER" biohubbc-$TS.tgz \
            -f ./infrastructure/biohubbc/values.yaml \
            -f ./infrastructure/biohubbc/values-pr.yaml \
            --set-string biohubbc-app.environment.ts=$TS \
            --set-string biohubbc-app.environment.id=$PR_NUMBER \
            --set-string biohubbc-app.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-db.environment.ts=$TS \
            --set-string biohubbc-db.environment.id=$PR_NUMBER \
            --set-string biohubbc-db.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-db.app.postgresAdmin=${{ secrets.DATABASE_ADMIN }} \
            --set-string biohubbc-db.app.postgresAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }} \
            --set-string biohubbc-db.app.postgresUser=${{ secrets.DATABASE_USER }} \
            --set-string biohubbc-db.app.postgresUserPassword=${{ secrets.DATABASE_USER_PASSWORD }} \
            --set-string biohubbc-db.app.postgresUserApi=${{ secrets.DATABASE_USER_API }} \
            --set-string biohubbc-db.app.postgresUserApiPassword=${{ secrets.DATABASE_USER_API_PASSWORD }} \
            --set-string biohubbc-db.app.postgresDb=${{ secrets.DATABASE_NAME }} \
            --set-string biohubbc-db-setup.environment.ts=$TS \
            --set-string biohubbc-db-setup.environment.id=$PR_NUMBER \
            --set-string biohubbc-db-setup.environment.changeId=$PR_NUMBER \
            --set-string biohubbc-api.environment.ts=$TS \
            --set-string biohubbc-api.environment.id=$PR_NUMBER \
            --set-string biohubbc-api.environment.changeId=$PR_NUMBER \
            --wait --timeout=600s
          
          echo "Helm chart deployment completed for PR $PR_NUMBER"

  # Aggregate Trivy scan results and comment on PR
  commentTrivyResults:
    name: Comment Trivy Results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false }}
    needs:
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
    steps:
      - name: Download all Trivy scan results
        uses: actions/download-artifact@v4
        with:
          path: trivy-results

      - name: Check for vulnerabilities and comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Function to parse SARIF file and extract vulnerability counts
            function parseSarifFile(filePath) {
              try {
                if (!fs.existsSync(filePath)) {
                  return { critical: 0, high: 0, total: 0 };
                }
                
                const sarifData = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                const results = sarifData.runs?.[0]?.results || [];
                
                const counts = { critical: 0, high: 0, total: 0 };
                
                results.forEach(result => {
                  const severity = result.properties?.vulnerability?.severity?.toLowerCase() || 
                                 result.ruleId?.toLowerCase() || 'unknown';
                  
                  counts.total++;
                  
                  if (severity.includes('critical')) counts.critical++;
                  else if (severity.includes('high')) counts.high++;
                });
                
                return counts;
              } catch (error) {
                console.log(`Error parsing ${filePath}:`, error.message);
                return { critical: 0, high: 0, total: 0 };
              }
            }
            
            // Parse all scan results
            const appResults = parseSarifFile('trivy-results/trivy-biohubbc-app-results/trivy-biohubbc-app-results.sarif');
            const databaseResults = parseSarifFile('trivy-results/trivy-biohubbc-db-results/trivy-biohubbc-db-results.sarif');
            const databaseSetupResults = parseSarifFile('trivy-results/trivy-biohubbc-db-setup-results/trivy-biohubbc-db-setup-results.sarif');
            const apiResults = parseSarifFile('trivy-results/trivy-biohubbc-api-results/trivy-biohubbc-api-results.sarif');
            
            // Calculate totals
            const totalCritical = appResults.critical + databaseResults.critical + databaseSetupResults.critical + apiResults.critical;
            const totalHigh = appResults.high + databaseResults.high + databaseSetupResults.high + apiResults.high;
            const totalVulnerabilities = totalCritical + totalHigh;
            
            // Only comment if there are vulnerabilities
            if (totalVulnerabilities > 0) {
              const comment = `## 🔍 Trivy Security Scan Results
              
              **Total Vulnerabilities Found:** ${totalVulnerabilities}
              
              | Severity | Count |
              |----------|-------|
              | 🔴 Critical | ${totalCritical} |
              | 🟠 High | ${totalHigh} |
              
              ### Breakdown by Image:
              
              **App Image:**
              - Critical: ${appResults.critical}, High: ${appResults.high}
              
              **Database Image:**
              - Critical: ${databaseResults.critical}, High: ${databaseResults.high}
              
              **Database Setup Image:**
              - Critical: ${databaseSetupResults.critical}, High: ${databaseSetupResults.high}
              
              **API Image:**
              - Critical: ${apiResults.critical}, High: ${apiResults.high}
              
              ---
              
              **Note:** This scan was performed using Trivy on the container images built for this PR, focusing only on Critical and High severity vulnerabilities with available fixes. Please review the vulnerabilities and consider updating dependencies or base images as needed.
              
              For detailed vulnerability information, check the workflow logs for the Trivy scan steps.`;
              
              // Post comment to PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              
              console.log(`Posted Trivy scan results comment to PR #${context.issue.number}`);
            } else {
              console.log('No vulnerabilities found in any of the scanned images');
            }

  # Report the overall status of all jobs.
  # Why? Skipped jobs are not considered successes when specifying requird jobs in the GitHub PR settings. Rather than
  # specify each job, we can specify this final job only, and use its status as an indicator of all previous jobs
  # having successfully run. We can then manually include the 'skipped' status as part our definition of success.
  workflowStatus:
    name: Workflow Status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false }}
    needs:
      - checkEnv
      - skipDuplicateActions
      - checkoutRepo
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
      - deployHelmChart
      - commentTrivyResults
    steps:
      - name: Log result
        run: |
          echo needs.checkEnv.result: ${{ needs.checkEnv.result }}
          echo needs.skipDuplicateActions.result: ${{ needs.skipDuplicateActions.result }}
          echo needs.checkoutRepo.result: ${{ needs.checkoutRepo.result }}
          echo needs.buildAndPushApp.result: ${{ needs.buildAndPushApp.result }}
          echo needs.buildAndPushDatabase.result: ${{ needs.buildAndPushDatabase.result }}
          echo needs.buildAndPushDatabaseSetup.result: ${{ needs.buildAndPushDatabaseSetup.result }}
          echo needs.buildAndPushAPI.result: ${{ needs.buildAndPushAPI.result }}
          echo needs.deployHelmChart.result: ${{ needs.deployHelmChart.result }}
          echo needs.commentTrivyResults.result: ${{ needs.commentTrivyResults.result }}

      - name: Report success
        if: |
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        run: |
          echo All deployments completed successfully or were skipped
          exit 0

      - name: Report failure
        if: |
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo One or more deployments failed or was cancelled
          exit 1
