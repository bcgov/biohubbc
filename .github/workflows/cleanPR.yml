# Clean PR artifacts and image tags.
# Runs when a PR is closed (merged or not), or when a PR is converted back to draft.
# Deletes PR Helm release in dev and the four PR image tags (build-1.0.0-{PR}) in -tools.
name: Clean PR Artifacts

on:
  pull_request:
    types: [closed, converted_to_draft]

permissions:
  contents: read
  
env:
  IMAGE_TAG: build-1.0.0-${{ github.event.number }}
  OC_VERSION: "4.16.60"
  OC_CACHE_DIR: ~/.cache/oc

jobs:
  clean:
    name: Clean PR Artifacts for API, App, DB, and DB Setup in Dev and Tools environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v6

      # Install oc (see .github/actions/setup-openshift-cli). Fork PRs have no secrets — oc commands will fail.
      - uses: ./.github/actions/setup-openshift-cli
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
        with:
          oc-version: ${{ env.OC_VERSION }}
          cache-dir: ${{ env.OC_CACHE_DIR }}
          login: "true"

      # Clean all PR artifacts for the PR using Helm
      - name: Clean PR Artifacts
        env:
          DEV_NAMESPACE: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev
        run: |
          echo "Cleaning PR artifacts for PR $PR_NUMBER"

          # An absent release is a no-op, but a failed uninstall must fail the job: it leaves
          # the PR's PVCs (and their storage quota) behind. Swallowing the error here would
          # report success and also hide the run from retryFailedJobs, which only sees failures.
          if helm status "pr-$PR_NUMBER" --namespace "$DEV_NAMESPACE" >/dev/null 2>&1; then
            echo "Uninstalling Helm release pr-$PR_NUMBER from $DEV_NAMESPACE..."
            helm uninstall "pr-$PR_NUMBER" --namespace "$DEV_NAMESPACE" --wait --timeout 10m
          else
            echo "No Helm release found in $DEV_NAMESPACE for PR $PR_NUMBER; nothing to uninstall."
          fi

          # PR PVCs carry no "helm.sh/resource-policy: keep" (that is set only for environment.id
          # "deploy"), so a clean uninstall removes them. Verify, and sweep any that outlived the
          # release — e.g. left by an interrupted uninstall or created outside the release.
          LEFTOVER=$(oc -n "$DEV_NAMESPACE" get pvc -o name 2>/dev/null | grep -E -- "-dev-${PR_NUMBER}\$" || true)
          if [ -n "$LEFTOVER" ]; then
            echo "PVCs still present for PR $PR_NUMBER after uninstall; deleting:"
            echo "$LEFTOVER"
            # shellcheck disable=SC2086
            oc -n "$DEV_NAMESPACE" delete $LEFTOVER
          else
            echo "No PVCs remain for PR $PR_NUMBER in $DEV_NAMESPACE."
          fi

          echo "Removing App image tag from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools namespace..."
          oc tag -d biohubbc-app:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          echo "Removing API image tag from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools namespace..."
          oc tag -d biohubbc-api:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          echo "Removing DB image tag from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools namespace..."
          oc tag -d biohubbc-db:${{ env.IMAGE_TAG }} --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"

          echo "Removing DB Setup image tag from ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools namespace..."
          oc tag -d biohubbc-db-setup:${{ env.IMAGE_TAG }}  --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools || echo "No image found for PR $PR_NUMBER"
          
          echo "Cleanup completed for PR $PR_NUMBER"
