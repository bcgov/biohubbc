name: Test Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Checkout the repo once and cache it for use in subsequent jobs
  checkoutRepo:
    name: Checkout and cache target branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      # Install Node - for `node` and `npm` commands
      # Note: This already uses actions/cache internally, so repeat calls in subsequent jobs are not a performance hit
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout Target Branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Cache the repo
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          # Cache repo based on the commit sha that triggered the workflow
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

  test:
    name: Running Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - checkoutRepo
    steps:
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6

      # api
      - name: Cache api node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-api-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install api dependencies
        working-directory: api
        run: npm ci --include=dev

      - name: Run api typecheck
        working-directory: api
        run: CI=true npm run typecheck

      - name: Run api tests with coverage
        working-directory: api
        run: CI=true npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: false

      # app
      - name: Cache app node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-app-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install app dependencies
        working-directory: app
        run: npm ci --include=dev

      - name: Run app typecheck
        working-directory: app
        run: CI=true npm run typecheck

      - name: Run app tests with coverage
        working-directory: app
        run: CI=true npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: false

      # Save coverage reports so updateCodecovBaseline.yml can re-upload them
      # against the dev commit when this PR is squash-merged
      - name: Save coverage reports artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            api/coverage/lcov.info
            app/coverage/lcov.info
