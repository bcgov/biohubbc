apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-{{ .Release.Revision }}
  namespace: {{ include "environment.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    role: setup
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        role: setup
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:15-alpine
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for database to be ready..."
              until pg_isready -h {{ include "dbHost" . }} -p 5432 -U $DB_ADMIN; do
                echo "Database not ready, waiting..."
                sleep 5
              done
              echo "Database is ready!"
          env:
            - name: DB_HOST
              value: {{ include "dbHost" . }}
            - name: DB_ADMIN
              valueFrom:
                secretKeyRef:
                  key: database-admin
                  name: {{ include "dbHost" . }}
            - name: DB_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  key: database-admin-password
                  name: {{ include "dbHost" . }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-admin-password
                  name: {{ include "dbHost" . }}
      containers:
        - name: postgresql
          env:
            - name: DB_HOST
              value: {{ include "dbHost" . }}
            - name: DB_ADMIN
              valueFrom:
                secretKeyRef:
                  key: database-admin
                  name: {{ include "dbHost" . }}
            - name: DB_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  key: database-admin-password
                  name: {{ include "dbHost" . }}
            - name: DB_USER_API
              valueFrom:
                secretKeyRef:
                  key: database-user-api
                  name: {{ include "dbHost" . }}
            - name: DB_USER_API_PASS
              valueFrom:
                secretKeyRef:
                  key: database-user-api-password
                  name: {{ include "dbHost" . }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: database-name
                  name: {{ include "dbHost" . }}
            - name: DB_PORT
              value: '5432'
            - name: CHANGE_VERSION
              value: {{ .Values.environment.changeId | quote }}
            - name: NODE_ENV
              value: {{ .Values.app.nodeEnv }}
            - name: VERSION
              value: {{ .Values.environment.name }}-{{ .Chart.AppVersion }}-{{ .Values.environment.changeId }}
            - name: DB_SCHEMA
              value: {{ .Values.app.dbSchema }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.image }}:{{ include "app.imageTag" . }}"
          imagePullPolicy: Always
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
      restartPolicy: Never
      activeDeadlineSeconds: 900
      dnsPolicy: ClusterFirst
  backoffLimit: 3
  activeDeadlineSeconds: 900
