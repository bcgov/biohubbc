# Development environment values for biohubbc chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

# Disabled: DEV uses the separate Crunchy Postgres Helm release (infrastructure/crunchy-db).
database:
  enabled: false

database-setup:
  enabled: true

clamav:
  enabled: true

api:
  enabled: true

# Values passed to biohubbc-app subchart
biohubbc-app:
  environment:
    licensePlate: "af2668"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""
  
  # App configuration
  app:
    nodeEnv: development
    apiHost: api-dev-biohubbc.apps.silver.devops.gov.bc.ca
    featureFlags: ""

    # BioHub Platform (aka: Backbone)
    backbonePublicApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 500Mi

  # Route configuration
  route:
    host: dev-biohubbc.apps.silver.devops.gov.bc.ca

# Values passed to biohubbc-db-setup subchart
biohubbc-db-setup:
  environment:
    licensePlate: "af2668"
    name: dev
    id: deploy  
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    database:
      host: "biohubbc-db-dev-primary"
      adminSecretName: "biohubbc-db-dev-pguser-postgres"
      appSecretName: "biohubbc-db-dev-pguser-biohub-api"
      dbNameSecretName: "biohubbc-db-dev-pguser-biohubbc-db-dev"

# Values passed to biohubbc-clamav subchart
biohubbc-clamav:
  environment:
    licensePlate: "af2668"
    name: dev
    id: deploy
    ts: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 1100m
      memory: 2Gi

# Values passed to biohubbc-api subchart
biohubbc-api:
  environment:
    licensePlate: "af2668"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=3000 # 75% of memoryLimit (bytes)
    appHost: dev-biohubbc.apps.silver.devops.gov.bc.ca
    featureFlags: ""

    # ClamAV
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # BioHub Platform (aka: Backbone)
    backboneInternalApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
    backbonePublicApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
    
    # Critterbase
    critterbaseApiHost: "https://moe-critterbase-api-dev.apps.silver.devops.gov.bc.ca/api"

    # Database
    database:
      host: "biohubbc-db-dev-primary"
      port: 5432
      appSecretName: "biohubbc-db-dev-pguser-biohub-api"
      dbNameSecretName: "biohubbc-db-dev-pguser-biohubbc-db-dev"
      adminSecretName: "biohubbc-db-dev-pguser-postgres"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    # Object Store (S3)
    objectStore:
      keyPrefix: sims
      
    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10

    # API Validation
    apiResponseValidationEnabled: true
    databaseResponseValidationEnabled: true

    # Telemetry
    telemetry:
      disabled: false
      deviceLimit: -1 # -1 means no limit

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 4Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohubbc-api-dev-deploy"

  # Route configuration (OpenShift)
  route:
    host: api-dev-biohubbc.apps.silver.devops.gov.bc.ca