# Default values for biohubbc chart
# This is a YAML-formatted file.

# Global configuration
global:
  environment:
    licensePlate: "af2668"
    name: "" # Environment name (dev, test, prod)
    id: "" # Environment id (PR, deploy)
    changeId: "" # Change id (PR number)
    ts: "" # Timestamp of the deployment

# Component configuration, passed through to the individual charts. Each key also carries the
# `enabled` flag its Chart.yaml dependency condition reads.
#
# NOTE: one block per component. A second `app:`/`database:`/... block would silently win over the
# first, because YAML keeps only the last occurrence of a duplicated key.
app:
  enabled: true
  environment:
    licensePlate: "af2668"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any app-specific overrides here

# Off by default: the biohubbc-db image is built only by deploy.yml, for PR previews. Static
# environments run the separate Crunchy Postgres release (infrastructure/crunchy-db), so an
# environment that inherited `true` here would render a Deployment for an image nobody builds.
database:
  enabled: false
  environment:
    licensePlate: "af2668"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  app:
    name: biohubbc-db
    nodeEnv: ""
    timezone: America/Vancouver
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""
    pgData: /var/lib/postgresql/data/17
  # Add any database-specific overrides here

database-setup:
  enabled: true
  environment:
    licensePlate: "af2668"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any database-setup-specific overrides here

clamav:
  enabled: true
  environment:
    licensePlate: "af2668"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  app:
    name: clamav
  # Add any clamav-specific overrides here

api:
  enabled: true
  environment:
    licensePlate: "af2668"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any api-specific overrides here