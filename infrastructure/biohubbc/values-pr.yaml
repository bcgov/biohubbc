# PR environment values for biohubbc chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohubbc-app subchart
biohubbc-app:
  environment:
    licensePlate: "af2668"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    # apiHost will be dynamically set: "biohubbc-api-1234-af2668-dev.apps.silver.devops.gov.bc.ca"
    featureFlags: ""

    # BioHub Platform (aka: Backbone)
    backbonePublicApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 500Mi

  # Route configuration
  # route.host will be dynamically set: "biohubbc-1234-af2668-dev.apps.silver.devops.gov.bc.ca"

# Values passed to biohubbc-db subchart
biohubbc-db:
  environment:
    licensePlate: "af2668"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 4Gi

  # Volume for persistent data
  persistence:
    size: 500Mi  # Smaller for PR environments

# Values passed to biohubbc-db-setup subchart
biohubbc-db-setup:
  environment:
    licensePlate: "af2668"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development

# Values passed to biohubbc-api subchart
biohubbc-api:
  environment:
    licensePlate: "af2668"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=3000 # 75% of memoryLimit (bytes)
    # appHost will be dynamically set: "biohubbc-app-1234-af2668-dev.apps.silver.devops.gov.bc.ca"
    featureFlags: "" # Feature flags
    
    # BioHub Platform (aka: Backbone)
    backboneInternalApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
    backbonePublicApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
    
    # Critterbase
    critterbaseApiHost: "https://moe-critterbase-api-dev.apps.silver.devops.gov.bc.ca/api"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    # Object Store (S3)
    # objectStore.keyPrefix will be dynamically set: "local/1234/sims"

    # Logging
    logging:
      level: debug
      levelFile: debug
      fileMaxFiles: 2  # Smaller for PR environments

    # API Validation
    apiResponseValidationEnabled: true
    databaseResponseValidationEnabled: true

    # Telemetry
    telemetry:
      disabled: true  # Disable telemetry for PR environments
      deviceLimit: 2  # Limit devices for PR testing

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 4Gi

  # Volume for logs and persistent data
  persistence:
    size: 100Mi  # Smaller for PR environments

  # Route configuration (OpenShift)
  # route.host will be dynamically set: "biohubbc-api-1234-af2668-dev.apps.silver.devops.gov.bc.ca"