# TEST environment overrides for Crunchy Postgres cluster.
# High-availability: 2 instances + 2 pgBouncer replicas, separate S3 backup path.

fullnameOverride: biohubbc-db-test-pg18

instances:
  # Sized from the database's size on disk, with room to grow; every volume in the namespace counts against
  # its storage quota. Volumes grow online but never shrink.
  replicas: 2
  dataVolumeClaimSpec:
    storage: 10Gi
  requests:
    cpu: 50m
    memory: 256Mi

proxy:
  pgBouncer:
    replicas: 2

pgBackRest:
  repos:
    - name: repo1
      path: "/biohubbc/test-pg18/hourly"
      fullSchedule: "0 12 * * *"
      retention: "1"
      retentionFullType: count
    - name: repo2
      path: "/biohubbc/test-pg18/daily"
      fullSchedule: "0 0 * * *"
      retention: "7"
      retentionFullType: count
    - name: repo3
      path: "/biohubbc/test-pg18/weekly"
      fullSchedule: "0 1 * * 0"
      retention: "4"
      retentionFullType: count
    - name: repo4
      path: "/biohubbc/test-pg18/monthly"
      fullSchedule: "0 3 1 * *"
      retention: "12"
      retentionFullType: count

patroni:
  postgresql:
    parameters:
      shared_buffers: 32MB

# One-time restore: set dataSource.enabled: true, deploy, wait for recovery, then set enabled: false and redeploy.
# repo1 + daily path avoids --repo=2 bootstrap issues
# For a specific backup, set dataSource.options, e.g. ["--set=20260320-000008F"], or use time/LSN options per pgBackRest docs.
dataSource:
  enabled: false
  repo:
    name: repo1
    path: "/biohubbc/test-pg18/daily"
  options: []

# One-time copy from the Postgres 17 cluster this one replaces (biohubbc-db-test). Leave it disabled here and
# enable it only for the migration run with --set migration.enabled=true (PG18_MIGRATION.md, step B).
migration:
  enabled: false
  oldDb:
    host: "biohubbc-db-test-primary"
    secretName: "biohubbc-db-test-pguser-postgres"
    adminKey: "user"
    passwordKey: "password"
    dbNameKey: "dbname"
