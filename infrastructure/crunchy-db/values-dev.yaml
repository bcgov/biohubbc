# DEV environment overrides for Crunchy Postgres cluster.
# Single instance (no HA), separate S3 backup path.

fullnameOverride: biohubbc-db-dev

instances:
  replicas: 1
  dataVolumeClaimSpec:
    storage: 5Gi
  requests:
    cpu: 50m
    memory: 256Mi

proxy:
  pgBouncer:
    replicas: 1

pgBackRest:
  repos:
    - name: repo1
      path: "/biohubbc/dev/hourly"
      fullSchedule: "0 12 * * *"
      retention: "1"
      retentionFullType: count
    - name: repo2
      path: "/biohubbc/dev/daily"
      fullSchedule: "0 0 * * *"
      retention: "7"
      retentionFullType: count
    - name: repo3
      path: "/biohubbc/dev/weekly"
      fullSchedule: "0 1 * * 0"
      retention: "4"
      retentionFullType: count
    - name: repo4
      path: "/biohubbc/dev/monthly"
      fullSchedule: "0 3 1 * *"
      retention: "12"
      retentionFullType: count

patroni:
  postgresql:
    parameters:
      shared_buffers: 16MB

# To perform the one-time data migration from the old database, set:
#   migration.enabled: true
#   migration.oldDb.host: "biohubbc-db-dev-deploy"
#   migration.oldDb.secretName: "biohubbc-db-postgresql-dev-deploy"
# Then re-deploy with migration.enabled: false once complete.
migration:
  enabled: false
  oldDb:
    host: "biohubbc-db-dev-deploy"
    secretName: "biohubbc-db-postgresql-dev-deploy"
