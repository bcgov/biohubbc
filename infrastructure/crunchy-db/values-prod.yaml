# PROD environment overrides for Crunchy Postgres cluster.
# High-availability: 2 instances + 2 pgBouncer replicas, separate S3 backup path, higher retention.

fullnameOverride: biohubbc-db-prod

instances:
  replicas: 2
  # Storage: 40Gi to allow one-time migration of ~1.8G dump (data + indexes + WAL/temp during restore).
  # Can reduce after migration if desired, or keep for growth.
  dataVolumeClaimSpec:
    storage: 40Gi
  requests:
    cpu: 100m
    memory: 512Mi

proxy:
  pgBouncer:
    replicas: 2

pgBackRest:
  repos:
    - name: repo1
      path: "/biohubbc/prod/hourly"
      fullSchedule: "0 12 * * *"
      retention: "1"
      retentionFullType: count
    - name: repo2
      path: "/biohubbc/prod/daily"
      fullSchedule: "0 0 * * *"
      retention: "7"
      retentionFullType: count
    - name: repo3
      path: "/biohubbc/prod/weekly"
      fullSchedule: "0 1 * * 0"
      retention: "4"
      retentionFullType: count
    - name: repo4
      path: "/biohubbc/prod/monthly"
      fullSchedule: "0 3 1 * *"
      retention: "12"
      retentionFullType: count

patroni:
  postgresql:
    parameters:
      shared_buffers: 64MB

# To perform the one-time data migration from the old database, set:
#   migration.enabled: true
#   migration.oldDb.host: "biohubbc-db-prod"
#   migration.oldDb.secretName: "biohubbc-db-postgresql-prod"
# Then re-deploy with migration.enabled: false once complete.
migration:
  enabled: false
  oldDb:
    host: "biohubbc-db-prod"
    secretName: "biohubbc-db-postgresql-prod"
