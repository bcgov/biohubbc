# Pull Request environment values for SIMS. This template will be used for dynamic PR deployments
environment:
  name: dev
  # id will be dynamically set: "1234"
  
# API configuration
app:
  nodeEnv: development
  nodeOptions: --max_old_space_size=3000 # 75% of memoryLimit (bytes)
  # appHost will be dynamically set: "biohubbc-app-1234-af2668-dev.apps.silver.devops.gov.bc.ca"
  featureFlags: "" # Feature flags
  
  # BioHub Platform (aka: Backbone)
  backboneInternalApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
  backbonePublicApiHost: "https://api-dev-biohub-platform.apps.silver.devops.gov.bc.ca"
  
  # Critterbase
  critterbaseApiHost: "https://moe-critterbase-api-dev.apps.silver.devops.gov.bc.ca/api"

  # Keycloak
  keycloak:
    host: "https://dev.loginproxy.gov.bc.ca/auth"
    cssApi:
      environment: dev

  # Object Store (S3)
  # objectStore.keyPrefix will be dynamically set: "local/1234/sims"

  # Logging
  logging:
    level: debug
    levelFile: debug
    fileMaxFiles: 2  # Smaller for PR environments

  # API Validation
  apiResponseValidationEnabled: true
  databaseResponseValidationEnabled: true

  # Telemetry
  telemetry:
    disabled: true  # Disable telemetry for PR environments
    deviceLimit: 2  # Limit devices for PR testing

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 600m
    memory: 4Gi

# Volume for logs and persistent data
persistence:
  size: 100Mi  # Smaller for PR environments

# Route configuration (OpenShift)
# route.host will be dynamically set: "biohubbc-api-1234-af2668-dev.apps.silver.devops.gov.bc.ca"