# Default values for api chart
environment:
  licensePlate: "af2668" # License plate of the project
  name: "" # Environment name (dev, test, prod)
  id: "" # Environment id (PR, deploy)
  ts: "" # Timestamp of the deployment

image:
  registry: "image-registry.openshift-image-registry.svc:5000" # The base image registry URL
  image: af2668-tools/biohubbc-api # Always pull from tools namespace

# API configuration
app:
  name: biohubbc-api
  nodeEnv: "" # NODE_ENV specification variable
  nodeOptions: "" # NODE_OPTIONS specification variable
  appHost: "" # APP host for application frontend
  timezone: America/Vancouver # Application timezone

  # Clamav
  clamav:
    enabled: true
    host: clamav
    port: 3310
    
  # BioHub Platform (aka: Backbone)
  backboneInternalApiHost: "" # API host for BioHub Platform Backbone. Example "https://platform.com".
  backbonePublicApiHost: ""
  backboneIntakePath: /api/submission/intake # The publishing intake endpoint path for BioHub Platform submissions. Example "/api/path/to/intake".
  backboneArtifactIntakePath: /api/artifact/intake # he publishing intake endpoint path for BioHub Platform artifact submissions. Example "/api/path/to/artifact/intake".
  biohubTaxonPath: /api/taxonomy/taxon # API path for BioHub Platform Backbone taxon endpoint. Example "/api/path/to/taxon"
  biohubTaxonTsnPath: /api/taxonomy/taxon/tsn # API path for BioHub Platform Backbone taxon TSN endpoint. Example "/api/path/to/taxon/tsn"
  
  # Critterbase
  critterbaseApiHost: "" # API host for the Critterbase service, SIMS API will hit this to retrieve critter metadata. Example "https://critterbase.com".

  # Database
  database:
    secretName: biohubbc-db
    serviceName: "" # Database service name associated with deployment
    port: 5432 # Database port'

  # Keycloak
  keycloak:
    host: "" # Keycloak login url
    realm: standard # Realm identifier or name
    clientId: sims-4461 # Client Id for application
    keycloakSecret: keycloak # The name of the keycloak secret
    serviceClient:
      name: sims-svc-4464 # keycloak host admin username
      passwordKey: sims_svc_client_password # The key of the admin password in the keycloak secret
    cssApi:
      tokenUrl: "https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token" # The url to fetch a css api access token, which is needed to call the css rest api
      clientId: service-account-team-1190-4229 # The css api client id
      host: "https://api.loginproxy.gov.bc.ca/api/v1" # The url of the css rest api
      secretKey: css_api_client_secret # The css api client secret
      environment: "" # The css api environment to query (dev, test, prod)

  # Object Store (S3)
  objectStore:
    keyPrefix: "" # S3 key optional prefix
    secretName: biohubbc-object-store # Secrets used to read and write to the S3 storage

  # Request limits
  requestLimits:
    bodySize: "52428800" # Maximum request body size in bytes
    uploadNumFiles: "10" # Maximum number of files uploaded in a single request
    uploadFileSize: "52428800" # Maximum upload file size in bytes
  
  # Logging
  logging:
    level: "" # Log level for logs written to the console (console transport)
    levelFile: "" # Log level for logs written to log files (file transport)
    fileDir: data/logs # Directory where log files are stored
    fileName: sims-api.log # Name of the log file
    fileDatePattern: YYYY-MM-DD # Date pattern for log the files
    fileMaxSize: 45m # Maximum size an individual log file can reach before a new file is created
    fileMaxFiles: "" # Either the maximum number of log files to keep (10) or the maximum number of days to keep log files (10d)
  
  # API Validation
  apiResponseValidationEnabled: ""
  databaseResponseValidationEnabled: ""
  
  # Feature flags
  featureFlags: "" # Used to identify features that should be temporarily disabled/hidden. Must be a comma delimited list of keywords.

  # GCNotify
  gcnotify:
    apiSecret: gcnotify-api-key # Secret for gcnotify api key
    adminEmail: biohub@gov.bc.ca # admin email for gcnotify api
    onboardingRequestEmailTemplate: 7779a104-b863-40ac-902f-1aa607d2071a # gcnotify email template id
    onboardingRequestSmsTemplate: af2f1e40-bd72-4612-9c5a-567ee5b26ca5 # gcnotify sms template id
    requestResubmitTemplate: c973da33-1f2b-435a-9429-d8ab4fd273c5 # gcnotify email resubmit template id
    emailUrl: "https://api.notification.canada.ca/v2/notifications/email"
    smsUrl: "https://api.notification.canada.ca/v2/notifications/sms" 

  # Telemetry
  telemetry:
    schedule: 0 0 * * * # The schedule for the telemetry cronjob
    disabled: "" # Boolean flag to disable the cronjob, only static deployments should run on schedule.
    deviceLimit: "" # Limit the number of devices to process in the telemetry cronjob. Used for PR cronjob deployments.
    secretKey: biohubbc-telemetry # The name of the Openshift Biohubbc telemetry secret

  # Lotek
  lotekApiHost: "https://webservice.lotek.com" # The host URL for Lotek webservice API

  # Vectronic
  vectronicApiHost: "https://api.vectronic-wildlife.com/v2" # The host URL for Vectronic webservice API

# Openshift Resources
replicas: ""
resources:
  requests:
    cpu: ""
    memory: ""
  limits:
    cpu: ""
    memory: ""

# Volume for logs and persistent data
persistence:
  enabled: true
  size: "" # Volume space available for data, e.g. 512Mi, 2Gi.
  storageClass: ""
  accessMode: ReadWriteMany
  mountPath: /opt/app-root/app/data

# Service configuration
service:
  type: ClusterIP
  name: 6100-tcp
  port: 6100
  targetPort: 6100

# Route configuration (OpenShift)
route:
  host: ""
