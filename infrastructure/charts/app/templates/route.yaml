apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.environment.licensePlate }}-{{ .Values.environment.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  host: {{ include "appHost" . }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  port:
    targetPort: {{ .Values.app.name }}-{{ .Values.service.name }}
  to:
    kind: Service
    name: {{ include "app.fullname" . }}
    weight: 100
  wildcardPolicy: None