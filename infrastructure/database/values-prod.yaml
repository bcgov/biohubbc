# Production environment values for SIMS
environment:
  name: prod
  id: deploy

# Database configuration
app:
  nodeEnv: production

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 4000m
    memory: 10Gi

# Volume for persistent data
persistence:
  existingClaim: "biohubbc-db-postgresql-prod"