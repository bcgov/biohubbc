# Development environment values for SIMS
environment:
  name: dev
  id: deploy

# Database configuration
app:
  nodeEnv: development

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 600m
    memory: 4Gi

# Volume for persistent data
persistence:
  size: 3Gi